[project]
name = "quality-kpi-reporting"
version = "0.7.0"
description = "Centralised Manufacturing Quality KPI Reporting System (portfolio project)"
requires-python = ">=3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
addopts = "-ra"
markers = [
    "db: needs the DEV database (python -m etl.deploy --env dev); skipped when it is unreachable",
]
